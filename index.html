<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the theme before first paint to avoid a flash. Stored
      // preference wins; otherwise follow the system.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* default to light */
        }
      })();
    </script>
    <title>Sauced Apple — Read Apple News links without a subscription</title>
    <meta
      name="description"
      content="Paste an apple.news link to find free ways to read the story — the publisher's own page, public archives, or an extracted transcript."
    />
    <!-- The meta tags below are rewritten per-article by the worker for
         /?url= permalinks (worker/lib/meta.ts) — keep property/name before
         content, matching META_TAG_RE. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sauced Apple" />
    <meta property="og:title" content="Sauced Apple" />
    <meta
      property="og:description"
      content="Read Apple News links without a subscription — free links, archives, and transcripts."
    />
    <meta property="og:url" content="https://saucedapple.com/" />
    <meta property="og:image" content="https://saucedapple.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sauced Apple" />
    <meta
      name="twitter:description"
      content="Read Apple News links without a subscription — free links, archives, and transcripts."
    />
    <meta name="twitter:image" content="https://saucedapple.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
