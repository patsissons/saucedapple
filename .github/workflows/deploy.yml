name: Deploy

# Deploys to production (saucedapple.com). Two entry points:
# - workflow_call: CI on main calls this after validation passes.
# - workflow_dispatch: manual deploys/rollbacks — optionally pass any
#   commit SHA (default: head of the selected branch, i.e. latest main).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (default: latest main)"
        required: false
        type: string
  workflow_call:
    inputs:
      sha:
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://saucedapple.com
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
